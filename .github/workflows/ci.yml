name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  solid-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run check
      - run: bun run test:unit
      - run: bun run test:unit
        working-directory: site
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solid-1-e2e
          path: |
            test-results/artifacts
            test-results/audio-hooks
            test-results/visualizers
            test-results/popover
            test-results/playback
            test-results/web-audio-mixer
            test-results/waveform
            test-results/sound-pad
            test-results/audio-player
            test-results/audio-devices
            test-results/blocks
            playwright-report
          if-no-files-found: ignore

  solid-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun add --no-save solid-js@2.0.0-rc.13 @solidjs/web@2.0.0-rc.13 @solidjs/vite-plugin@3.0.0-next.47 vite@8.3.2
      - run: bunx tsc -p tsconfig.solid2.json --noEmit
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --config playwright.solid2.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solid-2-e2e
          path: |
            test-results/solid2-artifacts
            test-results/audio-hooks
            test-results/visualizers
            test-results/popover
            test-results/playback
            test-results/web-audio-mixer
            test-results/waveform
            test-results/sound-pad
            test-results/audio-player
            test-results/audio-devices
            test-results/blocks
            playwright-report
          if-no-files-found: ignore

  site-spikes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: cd site && bunx playwright install --with-deps chromium
      - run: bun run site:spike:1
      - run: cd site && bun run spike:2
      - run: bun run registry:spike:3
      - run: bun run kobalte:spike:4
      - run: bun run site:spike:5
      - run: cd site && bun run build:release && bunx playwright test --grep-invert "compare upstream and local page structure"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solid-2-site-spikes
          path: |
            site/artifacts/spike-1.json
            site/artifacts/spike-2.json
            artifacts/registry-install.json
            artifacts/fader-e2e.json
            artifacts/fader-solid1.png
            artifacts/fader-solid2.png
            artifacts/parameter-slider-e2e.json
            artifacts/parameter-slider-solid1.png
            artifacts/parameter-slider-solid2.png
            artifacts/knob-e2e.json
            artifacts/knob-solid1.png
            artifacts/knob-solid2.png
            artifacts/pan-control-e2e.json
            artifacts/pan-control-solid1.png
            artifacts/pan-control-solid2.png
            artifacts/channel-toggle-e2e.json
            artifacts/channel-toggle-solid1.png
            artifacts/channel-toggle-solid2.png
            artifacts/volume-control-e2e.json
            artifacts/volume-control-solid1.png
            artifacts/volume-control-solid2.png
            artifacts/channel-strip-e2e.json
            artifacts/channel-strip-solid1.png
            artifacts/channel-strip-solid2.png
            artifacts/mixer-e2e.json
            artifacts/mixer-solid1.png
            artifacts/mixer-solid2.png
            artifacts/use-mixer-e2e.json
            artifacts/use-mixer-solid1.png
            artifacts/use-mixer-solid2.png
            artifacts/blocks-e2e.json
            artifacts/blocks-solid1.png
            artifacts/blocks-solid2.png
            artifacts/spike-4.json
            site/artifacts/spike-5.json
            site/artifacts/
            site/test-results/
            site/dist/client
            site/dist/server
            site/test-results
            site/playwright-report
          if-no-files-found: ignore
