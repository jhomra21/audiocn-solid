<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>audiocn parity viewer</title>
    <style>
      :root { color-scheme: dark; font: 13px system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #101114; color: #e6e7eb; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; height: 100dvh; }
      section { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
      header { display: flex; align-items: center; gap: 10px; padding: 8px; }
      input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #3c3d42; border-radius: 5px; background: #1c1d21; color: inherit; font: inherit; }
      iframe { width: 100%; height: 100%; border: 0; background: white; }
      @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <section>
        <header><strong>Upstream</strong><input data-pane="upstream" /></header>
        <iframe id="upstream" src="https://www.audiocn.dev/docs/components/level-meter"></iframe>
      </section>
      <section>
        <header><strong>Local Solid</strong><input data-pane="local" /></header>
        <iframe id="local" src="http://127.0.0.1:4180/docs/components/level-meter"></iframe>
      </section>
    </main>
    <script>
      for (const input of document.querySelectorAll("input[data-pane]")) {
        const frame = document.getElementById(input.dataset.pane);
        input.value = frame.src;
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") frame.src = input.value;
        });
      }
    </script>
  </body>
</html>
